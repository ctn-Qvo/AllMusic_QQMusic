name: 构建并上传发布版Jar包

on:
  workflow_dispatch:

jobs:
  build:
    name: 构建Jar包
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 使Gradle可执行
        run: chmod +x ./gradlew

      - name: 使用Gradle构建
        run: ./gradlew clean build

      - name: 上传Jar包作为工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/*.jar
